name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10 hits an Arborist bug on this dependency graph; npm 11 installs cleanly.
      - run: npx -y npm@11 ci
      - run: npm run check
